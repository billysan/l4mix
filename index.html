<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141414"><meta name="description" content="A local multi-source video mixer.">
  <script src="/src/theme.js"></script>
  <title>MIST — video mixer</title>
  <link rel="preload" href="/assets/fonts/BigBlueTermPlusNerdFontMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/bigblue.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section class="mixer-section" aria-label="Video control matrix" id="drop-zone">
      <input id="file-input" type="file" accept="video/*,.mkv,.mov,.webm,.mp4,.m4v,.ogv" multiple hidden>
      <input id="replace-input" type="file" accept="video/*,.mkv,.mov,.webm,.mp4,.m4v,.ogv" hidden>
      <div class="matrix-scroll" tabindex="0" aria-label="Sources and selected channel effects">
        <div class="matrix" id="matrix">
          <div class="matrix-columns" id="column-headings"><div class="source-column-label"><span>SOURCE</span><span id="source-count" class="source-count">0</span><button id="empty-add" class="add-source" aria-label="Add videos" title="Add videos">+</button></div></div>
          <div id="source-rows"></div>
          <div id="master-row"></div>
        </div>
      </div>
    </section>
    <aside class="monitor-section" aria-label="Mix output and configuration">
      <div class="monitor-shell" id="monitor-shell">
        <div id="mapping-surface" class="mapping-surface">
          <canvas id="output" width="1920" height="1080" aria-label="Combined video output"></canvas>
        </div>
      </div>
      <div class="output-panel">
        <div class="theme-settings"><label for="theme">THEME <select id="theme"><option value="classic">CLASSIC</option><option value="dark">DARK</option><option value="sunset">SUNSET</option><option value="tropicana">TROPICANA</option></select></label></div>
        <div class="output-settings">
          <label for="resolution">RESOLUTION <select id="resolution"><option value="360">640 × 360</option><option value="540">960 × 540</option><option value="720">1280 × 720</option><option value="1080" selected>1920 × 1080</option></select></label>
          <button id="open-output" class="button output-button">Open clean output <span aria-hidden="true">↗</span></button>
        </div>
        <div class="signal-controls"><span class="signal-label" id="signal-label" role="status">X SIGNAL</span><button id="reset-all" class="reset-button" title="Reset all source and master effects and output mapping">RESET</button></div>
        <div class="performance"><span class="live-dot" id="performance-dot"></span><span id="fps">0</span><span>FPS</span><span class="performance-separator">/</span><span id="dropped">0</span><span>DECODE DROPS</span></div>
        <dl class="system-stats" aria-label="System performance">
          <div><dt>CPU</dt><dd id="cpu-load" title="System-wide CPU utilization">—</dd></div>
          <div><dt>GPU</dt><dd id="gpu-load" title="Busiest supported GPU; unavailable drivers show a dash">—</dd></div>
          <div><dt>RAM</dt><dd id="memory-use" title="System-wide used / total RAM, excluding available cache on Linux">—</dd></div>
          <div><dt>RENDER CPU</dt><dd id="render-time" title="Average CPU time submitting each rendered frame; excludes asynchronous GPU execution">—</dd></div>
        </dl>
      </div>
    </aside>
    <div id="messages" class="messages" aria-live="polite"></div>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
